<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        body { 
            margin: 0; background: #000; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; 
            font-family: "Microsoft YaHei", sans-serif; 
            user-select: none; 
            outline: none;
        }
        
        .content-container {
            flex: 1; width: 100%; height: 100%; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        /* 全局隐藏图片，但在下面单独为二维码开启显示 */
        video, img, iframe { width: 100%; height: 100%; display: none; border: none; object-fit: contain; }
        .active { display: block !important; }

        .top-hover-zone {
            position: absolute; top: 0; left: 0; width: 100%; 
            height: 30%; min-height: 40px; z-index: 200;
            display: flex; flex-direction: column;
        }
        .top-hover-zone:hover .controls { opacity: 1; transform: translateY(0); }

        .controls {
            width: 100%; height: auto; 
            background: rgba(0,0,0,0.85); 
            position: relative; 
            opacity: 0; transform: translateY(-100%); transition: all 0.3s ease;
            font-size: clamp(4px, 3vw, 16px);
        }

        .drag-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            -webkit-app-region: drag; 
            z-index: 0; 
        }

        .control-items {
            position: relative; z-index: 10; 
            display: flex; align-items: center; 
            padding: 0.5em 0.6em; 
            box-sizing: border-box; width: 100%;
            pointer-events: none; 
        }

        .control-items > * {
            pointer-events: auto; 
            -webkit-app-region: no-drag; 
        }

        input[type="text"] { 
            flex: 1; 
            font-size: inherit; 
            margin-right: 0.6em; outline: none; 
            padding: 0.3em 0.5em; background: #333; color: white; border: 1px solid #555; border-radius: 0.3em;
            height: 2.2em; 
        }
        
        button, .btn-move { 
            font-size: inherit; 
            cursor: pointer; margin-right: 0.4em; padding: 0;
            background: #444; color: white; border: 1px solid #666; border-radius: 0.3em;
            display: flex; align-items: center; justify-content: center;
            width: 2.2em; height: 2.2em; 
            box-sizing: border-box;
        }
        
        button:hover { background: #666; }
        
        #btnBoss { color: #aaa; border-color: #888; }
        #btnBoss:hover { color: #fff; background: #666; }
        
        .btn-move { cursor: move; background: #2b5c82; border: 1px solid #3e7ca8; }
        .btn-move:hover { background: #3e7ca8; }
        
        .btn-close { background: #c00; border-color: #a00; }
        .btn-close:hover { background: #f00; }

        .only-mini { display: none; } 
        
        /* 迷你模式样式调整 */
        .controls.mini .control-items { justify-content: center; gap: 0.4em; }
        .controls.mini input[type="text"] { display: none; }
        
        /* 迷你模式下隐藏调色板和刷新按钮 */
        .controls.mini #btnColor, .controls.mini #btnRefreshColor { display: none; }
        
        .controls.mini .only-mini { display: flex; } 
        .controls.mini button, .controls.mini .btn-move { margin-right: 0; } 

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #1a1a1a; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            -webkit-app-region: no-drag; 
            display: none; 
        }
        .login-box {
            background: #2a2a2a; padding: 30px; border-radius: 8px; width: 320px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: #fff;
        }
        .login-box input { width: 100%; margin-bottom: 15px; box-sizing: border-box; background: #fff; color: #000; border: none; padding: 10px; font-size: 16px;}
        .login-box button { width: 100%; background: #2ea44f; border: none; padding: 10px; font-weight: bold; color: white; cursor: pointer; font-size: 16px;}
        #act-msg { margin-top: 15px; font-size: 12px; min-height: 1.5em; color: #ff5555; }

        .contact-qr {
            margin-top: 25px; text-align: center; border-top: 1px solid #444; padding-top: 15px;
        }
        .contact-qr p { font-size: 14px; color: #aaa; margin: 0 0 10px 0; }
        .contact-qr img {
            width: 120px; height: 120px; border-radius: 4px; background: #fff; padding: 5px;
            display: block; margin: 0 auto; 
        }
    </style>
</head>
<body tabindex="0">
    
    <div id="login-overlay">
        <div class="login-box">
            <h2>请输入激活码</h2>
            <input type="text" id="license-input" placeholder="输入 License Key" autocomplete="off">
            <button onclick="tryActivate()">立即激活</button>
            <p id="act-msg"></p>
            <div class="contact-qr">
                <p>扫码联系客服 / 购买激活码</p>
                <img id="qr-img" alt="客服二维码">
            </div>
        </div>
    </div>

    <div class="top-hover-zone">
        <div class="controls" id="ctrlBar">
            <div class="drag-layer"></div>
            <div class="control-items">
                <input type="text" id="urlInput" placeholder="支持网址.mp4.m3u8直接播放，支持本地 视频 / 图片 / PDF 拖拽">
                
                <input type="color" id="colorPicker" style="display:none" onchange="submitColor()">
                
                <button onclick="clickBtn(playMedia)" title="播放/刷新">▶</button>
                <button onclick="clickBtn(closeMedia)" title="关闭当前媒体">⏹</button>
                <button id="btnBoss" onclick="clickBtn(toggleBoss)" title="老板键 (Alt+Q)">👻</button>
                <button id="btnTop" onclick="clickBtn(toggleTop)" title="置顶">📌</button>

                <button onclick="clickBtn(toggleSize)" title="切换模式">📺</button>
                <button id="btnColor" onclick="openPicker()" title="设置标题栏颜色">🎨</button>
                <button id="btnRefreshColor" onclick="submitColor()" title="如果颜色未生效，点此刷新">↻</button>
                
                <div class="btn-move only-mini" onmousedown="startDrag()" title="拖动">✥</div>
                <button class="only-mini" onclick="clickBtn(doMin)" title="最小化">-</button>
                <button class="btn-close only-mini" onclick="clickBtn(doClose)" title="关闭">×</button>
            </div>
        </div>
    </div>

    <div class="content-container">
        <video id="vPlayer" controls autoplay></video>
        <img id="imgViewer" alt="Image Viewer">
        <iframe id="pdfViewer"></iframe>
    </div>

    <script>
        const PORT = "{{PORT}}";
        const video = document.getElementById('vPlayer');
        const img = document.getElementById('imgViewer');
        const pdf = document.getElementById('pdfViewer');
        const input = document.getElementById('urlInput');
        const ctrlBar = document.getElementById('ctrlBar');
        const overlay = document.getElementById('login-overlay');
        const actMsg = document.getElementById('act-msg');
        
        const qrImg = document.getElementById('qr-img');
        if (qrImg) { qrImg.src = `http://127.0.0.1:${PORT}/images.png`; }

        let isMini = false;
        let isTop = false;
        let hls = null;
        let currentType = 'video';

        function openPicker() { document.getElementById('colorPicker').click(); }
        function submitColor() {
            const hex = document.getElementById('colorPicker').value;
            if(window.setTitleColor) window.setTitleColor(hex);
            setTimeout(() => { document.body.focus(); }, 50);
        }

        function clickBtn(fn) {
            if (typeof fn === 'function') fn();
            setTimeout(() => {
                if (document.activeElement) document.activeElement.blur();
                document.body.focus();
                window.focus();
            }, 50);
        }

        function doMin() { if(window.winMin) window.winMin(); }
        function doClose() { if(window.winClose) window.winClose(); }
        function startDrag() { if(window.winMove) window.winMove(); }
        function toggleBoss() { if(window.bossKey) window.bossKey(); }
        
        function toggleSize() {
            isMini = !isMini;
            if(window.toggleMode) window.toggleMode(isMini);
            if(isMini) {
                ctrlBar.classList.add('mini');
            } else {
                ctrlBar.classList.remove('mini');
            }
        }
        
        function toggleTop() {
            isTop = !isTop;
            if(window.setTop) window.setTop(isTop);
            const btn = document.getElementById('btnTop');
            btn.style.background = isTop ? '#2ea44f' : '#444';
            btn.style.borderColor = isTop ? '#2ea44f' : '#666';
        }

        window.onload = async () => {
            document.body.focus();
            if (window.checkLicense) {
                try {
                    const status = await window.checkLicense();
                    if (status.valid) { 
                        console.log(status.msg); 
                    } else { 
                        overlay.style.display = 'flex'; 
                        actMsg.innerText = status.msg; 
                    }
                } catch (e) { console.error(e); }
            }
        };

        async function tryActivate() {
            const code = document.getElementById('license-input').value;
            if(!code) return;
            actMsg.innerText = "验证中...";
            try {
                const res = await window.activate(code);
                if (res.success) {
                    actMsg.style.color = "#4caf50"; actMsg.innerText = res.msg;
                    setTimeout(() => { overlay.style.display = 'none'; }, 1000);
                } else { actMsg.style.color = "#ff5555"; actMsg.innerText = res.msg; }
            } catch (e) { actMsg.innerText = "接口错误"; }
        }

        // --- 核心修改：支持本地文件和网络代理播放 ---
        function playMedia() {
            let val = input.value.trim();
            if (!val) return;

            // 1. 本地 Blob 文件 (拖拽产生)，直接加载
            if (val.startsWith('blob:')) {
                loadResource(val);
                return;
            }

            // 2. HTTP/HTTPS 网络链接，走 Go 代理
            if (val.startsWith('http://') || val.startsWith('https://')) {
                const rawUrl = val.replace(/^https?:\/\//, '');
                // 拼接代理地址
                const proxyUrl = `http://127.0.0.1:${PORT}/proxy/${rawUrl}`;
                console.log("通过代理播放:", proxyUrl);
                loadResource(proxyUrl);
                return;
            }

            // 3. 既不是 blob 也不是 http，默认为本地相对路径文件
            const localFileUrl = `http://127.0.0.1:${PORT}/${val}`;
            loadResource(localFileUrl);
        }

        function closeMedia() {
            video.pause();
            video.removeAttribute('src'); 
            video.load(); 
            if (hls) { hls.destroy(); hls = null; }

            img.removeAttribute('src');
            pdf.removeAttribute('src');

            video.classList.remove('active');
            img.classList.remove('active');
            pdf.classList.remove('active');

            input.value = ''; 
            currentType = '';
        }

        function loadResource(src, typeHint) {
            video.pause(); video.classList.remove('active'); img.classList.remove('active'); pdf.classList.remove('active');
            const cleanSrc = src.split('?')[0].toLowerCase();

            let isImage = false;
            let isPdf = false;

            if (typeHint === 'image') isImage = true;
            else if (typeHint === 'pdf') isPdf = true;
            else if (typeHint === 'video') { /* is video */ }
            else {
                if (cleanSrc.match(/\.(jpg|jpeg|png|gif|webp|svg)$/)) isImage = true;
                else if (cleanSrc.endsWith('.pdf')) isPdf = true;
            }

            if (isImage) { 
                currentType = 'image'; 
                img.src = src; 
                img.classList.add('active'); 
            } 
            else if (isPdf) { 
                currentType = 'pdf'; 
                pdf.src = src; 
                pdf.classList.add('active'); 
            } 
            else { 
                currentType = 'video'; 
                video.classList.add('active'); 
                if (hls) { hls.destroy(); hls = null; } 
                
                if (cleanSrc.includes('.m3u8')) { 
                    if (Hls.isSupported()) { 
                        hls = new Hls({ debug: false });
                        hls.loadSource(src); 
                        hls.attachMedia(video); 
                        
                        hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                            video.play().catch(e => console.log("Auto-play blocked:", e));
                        }); 

                        hls.on(Hls.Events.ERROR, function (event, data) {
                            if(window.goLog) window.goLog("HLS Error: " + data.type + " - " + data.details);
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.log("fatal network error, try to recover");
                                        hls.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.log("fatal media error, try to recover");
                                        hls.recoverMediaError();
                                        break;
                                    default:
                                        hls.destroy();
                                        break;
                                }
                            }
                        });
                        
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                        video.src = src; 
                        video.addEventListener('loadedmetadata', function() { video.play(); }); 
                    } 
                } else { 
                    video.src = src; 
                    video.play(); 
                } 
            }
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); if (currentType === 'video') { video.paused ? video.play() : video.pause(); } break;
                case 'ArrowRight': if (currentType === 'video') { video.currentTime = Math.min(video.duration, video.currentTime + 5); } break;
                case 'ArrowLeft': if (currentType === 'video') { video.currentTime = Math.max(0, video.currentTime - 5); } break;
            }
        });
        document.addEventListener('mousedown', (e) => { if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { setTimeout(() => { document.body.focus(); }, 10); } });
        document.body.addEventListener('dragover', e => e.preventDefault());
        
        document.body.addEventListener('drop', e => { 
            e.preventDefault(); 
            if (e.dataTransfer.files.length > 0) { 
                const file = e.dataTransfer.files[0]; 
                const localUrl = URL.createObjectURL(file); 
                input.value = file.name; 
                const type = file.type; 
                if (type.startsWith('image/')) { 
                    loadResource(localUrl, 'image'); 
                } else if (type === 'application/pdf') { 
                    loadResource(localUrl, 'pdf'); 
                } else { 
                    loadResource(localUrl, 'video'); 
                } 
            } 
        });
        document.body.addEventListener('dblclick', (e) => { if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return; if(e.target.closest('.controls')) return; if (currentType === 'video') { video.paused ? video.play() : video.pause(); } });
    </script>
</body>
</html>
